appId: com.klartext.app
productName: Klartext
directories:
  buildResources: build
  output: dist
asar: false
files:
  - out/**/*
  - package.json
  - '!**/node_modules/**/*'
asarUnpack:
  - resources/**
win:
  executableName: Klartext
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  identity: "johan zetterstrom (6W6TD6P8G3)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  electronLanguages:
    - en
    - en_GB
    - sv
  target:
    - target: dir
      arch:
        - arm64
linux:
  target:
    - AppImage
    - deb
  maintainer: klartext.local
  category: Utility
fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
  - ext: markdown
    name: Markdown Document
    role: Editor
  - ext: klartext-workspace
    name: Klartext Multi-Root Workspace
    role: Editor
