name: Klartext CI & Cross-Platform Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Unit, Security, and Integration Tests
        run: npm test

      - name: Build Main, Preload, and Renderer bundles
        run: npm run build

      - name: Run Playwright Electron E2E Tests (macOS & Windows)
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:e2e

      - name: Run Playwright Electron E2E Tests (Linux Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Package Platform Deliverable
        run: npm run package
